    - group: style
      label: 样式
      formSchema:
        - $formkit: radio
          name: prefers_theme
          label: 默认配色
          value: auto
          options:
            - label: 跟随系统
              value: auto
            - label: 浅色
              value: light
            - label: 深色
              value: dark
        - $formkit: switch
          name: smooth_scroll
          label: smooth_scroll
          help: 开启时如果目录过长可能无法准确定位
          value: false
        - $formkit: group
          name: font_size
          label: 字体大小
          value:
            root: 16px
            body: 17px
            code: 85%
            codeblock: 0.8125rem
          children:
            - $formkit: text
              name: root
              label: 全局文字的字号
            - $formkit: text
              name: body
              label: 正文区域的字号
              help: 影响正文区域的字号，如果改成 px 则不受 root 影响
            - $formkit: text
              name: code
              label: 所在行的文本大小
              help: 相较于其所在行的文本大小，建议用百分比
            - $formkit: text
              name: codeblock
              label: codeblock
        - $formkit: group
          name: font_family
          label: 字体
          value:
            logo: system-ui, "Microsoft Yahei", "Segoe UI", -apple-system, Roboto, Ubuntu, "Helvetica Neue", Arial, "WenQuanYi Micro Hei", sans-serif
            body: system-ui, "Microsoft Yahei", "Segoe UI", -apple-system, Roboto, Ubuntu, "Helvetica Neue", Arial, "WenQuanYi Micro Hei", sans-serif
            code: Menlo, Monaco, Consolas, system-ui, "Courier New", monospace, sans-serif
            codeblock: Menlo, Monaco, Consolas, system-ui, "Courier New", monospace, sans-serif
          children:
            - $formkit: text
              name: logo
              label: logo
            - $formkit: text
              name: body
              label: body
            - $formkit: text
              name: code
              label: code
            - $formkit: text
              name: codeblock
              label: codeblock
        - $formkit: text
          name: text_align
          label: text-align
          value: left
          validation: required
        - $formkit: group
          name: border_radius
          label: 圆角
          value:
            card_l: 16px
            card: 12px
            bar: 8px
            image: 12px
          children:
            - $formkit: text
              name: card_l
              label: 侧边栏、文章横幅位置的圆角
            - $formkit: text
              name: card
              label: 文章内大部分卡片的圆角
            - $formkit: text
              name: bar
              label: 横条类元素的圆角
            - $formkit: text
              name: image
              label: 图片圆角
        - $formkit: group
          name: color
          label: 颜色
          value:
            background: 212 16% 98%
            block: 212 8% 95%
            code: 220 20% 10%
            text: 0 0% 20%
            theme: "#1cd0fd"
            accent: "#ff5724"
            link: "#2094f3"
            hover: "#ff5724"
          children:
            - $formkit: text
              name: background
              label: 浅色背景颜色
            - $formkit: text
              name: block
              label: 块背景颜色
            - $formkit: text
              name: code
              label: 行内代码颜色
            - $formkit: text
              name: text
              label: 文本颜色
            - $formkit: color
              name: theme
              label: 主题色
            - $formkit: color
              name: accent
              label: 强调色
            - $formkit: color
              name: link
              label: 超链接颜色
            - $formkit: color
              name: hover
              label: 按钮高亮颜色
        - $formkit: group
          name: animated_avatar
          label: animated_avatar
          value:
            animate: auto
            background: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/rainbow64@3x.webp
          children:
            - $formkit: select
              name: animate
              label: animate
              options:
                - label: auto
                  value: auto
                - label: always
                  value: always
            - $formkit: attachment
              name: background
              label: background
              width: "15rem"
              aspectRatio: "16/9"
              accepts:
                - "image/*"
        - $formkit: group
          name: leftbar
          label: 左侧背景
          help: 可以设置：纯色/渐变色/图片作为背景
          value:
            enable: false
            background: var(--leftbar-bg)
            background_image: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.13/image/sidebar-bg1@small.jpg
            blur_px: 100px
            blur_bg: var(--alpha60)
          children:
            - $formkit: switch
              name: enable
              id: leftbar_enable
              label: 开启
              help: 可以设置：纯色/渐变色/图片作为背景
            - $formkit: text
              if: $get(leftbar_enable).value
              name: background
              label: 背景
            - $formkit: attachment
              if: $get(leftbar_enable).value
              name: background_image
              label: 图片
              width: "15rem"
              aspectRatio: "16/9"
              accepts:
                - "image/*"
            - $formkit: text
              if: $get(leftbar_enable).value
              name: blur_px
              label: 大小
            - $formkit: text
              if: $get(leftbar_enable).value
              name: blur_bg
              label: 颜色
        - $formkit: attachment
          name: error_page
          label: 404页面
          width: "15rem"
          aspectRatio: "16/9"
          value: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/404/1c830bfcd517d.svg
          accepts:
            - "image/*"

