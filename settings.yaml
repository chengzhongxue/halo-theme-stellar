            - $formkit: number
              name: max_font
              label: 最小字体
            - $formkit: number
              name: amount
              label: 数量
            - $formkit: switch
              name: color
              label: 使用颜色
            - $formkit: color
              name: start_color
              label: 开始的颜色
            - $formkit: color
              name: end_color
