apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-stellar-setting
spec:
  forms:
    - group: logo
      label: logo
      formSchema:
        - $formkit: attachment
          name: avatar
          label: 图标
          accepts:
            - "image/*"
          value: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/avatar/round/3442075.svg
        - $formkit: text
          name: title
          label: 大标题
          value: 困困鱼
        - $formkit: text
          name: subtitle
          label: 标题
          value: 风暴前夕|kunkunyu.com
          help: 文字1 | 文字2 (鼠标放上去会切换到文字2)

    - group: menubar
      label: 侧边栏-导航菜单
      formSchema:
        - $formkit: number
          name: columns
          label: 一行多少个
          value: 4
        - $formkit: array
          name: items
          label: 菜单
          min: 1
          itemLabels:
            - type: iconify
              label: $value.icon
            - type: text
              label: $value.title
            - type: text
              label: $value.url
          value: 
            - theme: "#1BCDFC"
              icon:
              title: "博客"
              url: "/"
            - theme: "#3DC550"
              icon:
              title: "文档"
              url: "/docs"
            - theme: "#FA6400"
              icon:
              title: "探索"
              url: "/explore"
            - theme: "#F44336"
              icon:
              title: "社交"
              url: "/links"
          children:
            - $formkit: color
              name: theme
              label: 高亮时的颜色
              help: 仅 svg 中 fill="currentColor" 时有效
            - $formkit: iconify
              name: icon
              label: 图标
              format: svg # svg / dataurl / url / name
            - $formkit: text
              name: title
              label: 标题
            - $formkit: text
              name: url
              label: 链接

    - group: site_tree
      label: 站点主结构树
      formSchema:
        - $formkit: group
          name: index
          label: 首页
          value:
            leftbar: 
              - widget: recent_post
            rightbar: []
            nav_tabs:
              - title: "近期发布"
                url: "/"
              - title: "分类"
                url: "/categories"
              - title: "标签"
                url: "/tags"
              - title: "归档"
                url: "/archives"
          children:
            - $formkit: array
              name: leftbar
              id: leftbar
              label: 左侧栏
              itemLabels:
                - type: text
                  label: $value.widget
              children:
                - $formkit: select
                  name: widget
                  id: widget
                  key: widget
                  label: "小工具"
                  options:
                    - value: "recent_post"
                      label: 最近文章
                    - value: "ghuser"
                      label: ghuser
                    - value: "linklist"
                      label: 链接
                    - value: "tagcloud"
                      label: 标签
                    - value: "friends"
                      label: 朋友圈动态
                    - value: "moment"
                      label: 瞬间动态
                    - value: "markdown"
                      label: 自定义
                - $formkit: group
                  name: markdown
                  if: $value.widget == 'markdown'
                  key: markdown
                  label: 自定义内容
                  children:
                    - $formkit: text
                      name: title
                      label: 标题
                      value: ""
                      language: html
                    - $formkit: text
                      name: src
                      label: 内容链接
                      help: 可以设置外部 html 内容链接    
                    - $formkit: code
                      name: content
                      label: 内容
                      height: 200px
                      help: 支持html语法
                      language: html     
                    - $formkit: number
                      name: columns
                      value: 1
                      label: 链接列表-每行几个按钮
                      help: 为1显示为列表，2是每两个按钮放一行
                    - $formkit: array
                      name: items
                      label: 链接列表
                      itemLabels:
                        - type: iconify
                          label: $value.icon
                        - type: text
                          label: $value.title
                        - type: text
                          label: $value.url
                      children:
                        - $formkit: iconify
                          name: icon
                          label: 图标
                          format: svg # svg / dataurl / url / name
                          validation: required
                        - $formkit: text
                          name: title
                          label: 标题
                          validation: required
                        - $formkit: text
                          name: url
                          label: 链接
                          validation: required
            - $formkit: array
